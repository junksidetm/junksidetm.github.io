name: Deploy Codeberg Pages

# Builds the Next.js static export and publishes it to the `pages` branch,
# served at https://mrdarksidetm.codeberg.page. Needs the CODEBERG_TOKEN repo secret.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Next.js Static Export
        run: pnpm build

      - name: Deploy to pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_branch: pages
          publish_dir: ./out
          github_token: ${{ secrets.CODEBERG_TOKEN || secrets.GITHUB_TOKEN }}
